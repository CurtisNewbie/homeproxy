app:
  name: homeproxy

server:
  port: 7990
  # The management surface stays on loopback; only the proxy port is reachable
  # from the network.
  host: 127.0.0.1

consul:
  enabled: false

metrics:
  enabled: false

homeproxy:
  port: 17890
  dial-timeout-seconds: 10
  # String props are expanded from the environment by miso: ${VAR} or
  # ${VAR:default}. Unset variables expand to the empty default, which means
  # "dial the target directly" for the upstream and no upstream credentials.
  upstream:
    address: "${HOMEPROXY_UPSTREAM:}"
    username: "${HOMEPROXY_UPSTREAM_USERNAME:}"
    password: "${HOMEPROXY_UPSTREAM_PASSWORD:}"
    # What the upstream carries: all sends every target that is not in bypass
    # to it; pac sends only the hosts the PAC file routes through the proxy.
    egress: all
  # Exact host, or *.suffix covering the suffix host and its subdomains; hosts
  # listed here bypass the upstream and are exempt from the private-network
  # guard.
  bypass: []
  # Client addresses that use the proxy without a credential: an IPv4/IPv6
  # address or a CIDR. Trust replaces the credential only — the private-network
  # guard still applies, so a private target still needs a bypass entry.
  # Every device on a listed network is trusted, so keep this to networks you
  # control.
  # This list and users cannot both be empty: without either, the service
  # refuses to start.
  # trusted-clients: ["192.168.31.0/24"]
  trusted-clients: []

  # The PAC file served at GET /proxy.pac, for iOS Automatic mode.
  # mode: direct sends only proxy-hosts through the proxy and everything else
  # direct; mode: proxy does the reverse, exempting direct. Only the active
  # mode's list is read, and the other one logs a startup warning.
  pac:
    mode: direct
    proxy-hosts:
      - api.weibo.cn
      - "*.corp.internal"
    # Used only when pac.mode is proxy.
    direct: []
    # Address the file names as the proxy, as host:port. Empty derives it from
    # the request Host and homeproxy.port, which is right when the client
    # reaches the box on the same address it fetched the file from.
    proxy: ""
    # Serve /proxy.pac only to addresses in trusted-clients. Needs a non-empty
    # trusted-clients; with none, the file goes to nobody and startup warns. Set
    # this to false to serve the file to any address that can reach the proxy
    # port.
    require-trusted-client: true

  # Basic auth credentials, one per device, as name/secret pairs. Optional: a
  # trusted client address authorizes on its own. Uncomment and fill in when a
  # device must be authorized by credential instead of by address.
  # users:
  #   - name: phone
  #     secret: replace-with-a-long-random-secret
# Managed clash keeps one selector group on a fixed member. Uncomment this block
# to turn it on. The string props come from HOMEPROXY_MANAGED_CLASH_CONTROLLER,
# HOMEPROXY_MANAGED_CLASH_SECRET, HOMEPROXY_MANAGED_CLASH_SELECTOR, and
# HOMEPROXY_MANAGED_CLASH_PROXY_NAME; leave the secret env unset when the
# controller needs no bearer token.
# managed-clash:
#   enabled: true
#   controller: "${HOMEPROXY_MANAGED_CLASH_CONTROLLER:http://localhost:9990}"
#   secret: "${HOMEPROXY_MANAGED_CLASH_SECRET:}"
#   selector: "${HOMEPROXY_MANAGED_CLASH_SELECTOR:}"
#   proxy-name: "${HOMEPROXY_MANAGED_CLASH_PROXY_NAME:}"
#   # Go duration, e.g. "15m"; a bare number means nanoseconds.
#   interval: 15m
