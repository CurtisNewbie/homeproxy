app:
  name: homeproxy

server:
  port: 7990
  # The management surface stays on loopback; only the proxy port is reachable
  # from the network.
  host: 127.0.0.1

consul:
  enabled: false

metrics:
  enabled: true

homeproxy:
  port: 17890
  dial-timeout-seconds: 10
  # String props are expanded from the environment by miso: ${VAR} or
  # ${VAR:default}. Unset variables expand to the empty default, which means
  # "dial the target directly" for the upstream and no upstream credentials.
  upstream: "${HOMEPROXY_UPSTREAM:}"
  upstream.username: "${HOMEPROXY_UPSTREAM_USERNAME:}"
  upstream.password: "${HOMEPROXY_UPSTREAM_PASSWORD:}"
  # List props are NOT expanded from ${ENV}; entries are literal. Exact host or
  # *.suffix; hosts listed here bypass the upstream and are exempt from the
  # private-network guard.
  bypass: []
  # List props are NOT expanded from ${ENV}; entries are literal. Client
  # addresses listed here use the proxy without a credential — an IPv4/IPv6
  # address or a CIDR. Trust replaces the credential only: the private-network
  # guard still applies. Keep the entries to networks you control, because every
  # device on one of them gets access.
  # trusted-clients: ["192.168.31.0/24"]
  trusted-clients: []
  # The PAC file at GET /proxy.pac, for iOS Automatic mode. List props are
  # literal. `mode: direct` sends only pac.proxy-hosts through the proxy and
  # everything else direct; `mode: proxy` does the reverse, exempting pac.direct.
  # `proxy` is the address the file names; empty derives it from the request Host
  # and homeproxy.port.
  pac.mode: direct
  # pac.proxy-hosts: ["api.weibo.cn", "*.corp.internal"]
  pac.proxy-hosts: []
  # Used only when pac.mode is proxy.
  # pac.direct: ["api.weibo.cn"]
  pac.direct: []
  # pac.proxy: "192.168.31.51:17890"
  pac.proxy: ""
  # Serve /proxy.pac only to addresses in trusted-clients. Requires a non-empty
  # trusted-clients; with none, the file goes to nobody and startup warns. Set
  # this to false to serve the file to any address that can reach the proxy port.
  pac.require-trusted-client: true
  # List props are NOT expanded from ${ENV} either: the name and secret below
  # are literal values. Replace the placeholder with a long random secret per
  # device before deploying, or mount your own config over /conf/conf.yml.
  # This list is optional: a trusted client address authorizes on its own, so
  # leave it out when trusted-clients covers every device that needs access.
  # At least one of the two lists must be non-empty.
  users:
    - name: phone
      secret: replace-with-a-long-random-secret
