app:
  name: homeproxy

server:
  port: 7990
  # The management surface stays on loopback; only the proxy port is reachable
  # from the network.
  host: 127.0.0.1

consul:
  enabled: false

metrics:
  enabled: false

homeproxy:
  port: 17890
  upstream:
    # address: "127.0.0.1:7897"
    # username: "user"
    # password: "secret"
    # What the upstream carries: all sends every target that is not in bypass to
    # it; pac sends only the hosts the PAC file routes through the proxy.
    egress: all
  dial-timeout-seconds: 10
  bypass: []
  # Client addresses that use the proxy without a credential: an IPv4/IPv6
  # address or a CIDR. Trust replaces the credential only — the private-network
  # guard still applies, so a private target still needs a bypass entry.
  # trusted-clients: ["192.168.31.0/24"]
  trusted-clients: []
  pac:
    mode: proxy
    proxy-hosts:
      - "*.youtube.com"
      - "*.m-youtube.com"
      - "www.gstatic.com"
      - "*.googlevideo.com"
      - "*.ytimg.com"
      - "*.googleapis.com"
    # Used only when pac.mode is proxy.
    # pac.direct: ["api.localdomain"]
    direct: []
    # proxy: "{homeproxy_ip}:17890"
    proxy: "192.168.1.254:17890"

  # Basic auth credentials, one per device. Optional: a trusted client address
  # authorizes on its own, and at least one of these two lists must be non-empty.
  users:
    - name: phone
      secret: change-me
