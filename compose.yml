services:
  homeproxy:
    build:
      context: .
    image: homeproxy:local
    restart: unless-stopped
    # miso takes the config path as a CLI-style key=value argument.
    command: ["configFile=/conf/conf.yml"]
    # Only the proxy port is published. server.port (management: /health,
    # /metrics, default 7990) stays inside the container and off the host.
    ports:
      - "17890:17890"
    # String props in conf-prod.yml are expanded from the container environment;
    # unset variables fall back to the defaults written in that file.
    environment:
      HOMEPROXY_UPSTREAM: ${HOMEPROXY_UPSTREAM:-}
      HOMEPROXY_UPSTREAM_USERNAME: ${HOMEPROXY_UPSTREAM_USERNAME:-}
      HOMEPROXY_UPSTREAM_PASSWORD: ${HOMEPROXY_UPSTREAM_PASSWORD:-}
    volumes:
      # Credentials live in this file; it must exist on the host and is read-only
      # to the container. Replace its placeholder secret before deploying.
      - ./conf-prod.yml:/conf/conf.yml:ro
    # Dedicated network, not shared with any other application's containers:
    # nothing else can reach this service by name, and the proxy cannot reach
    # other applications' containers by name.
    networks:
      - homeproxy

networks:
  homeproxy:
    # Outbound internet access is needed (the proxy forwards traffic); the
    # network is isolated from every other compose project.
    internal: false
